name: Verificar AWS Rappi-Stream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-aws:
    runs-on: [self-hosted, Linux, X64, rappi-production]
    timeout-minutes: 5

    steps:
      - name: Verificar runner
        run: |
          echo "Runner conectado correctamente"
          hostname
          whoami

      - name: Verificar contenedores
        run: |
          cd /home/ubuntu/rappi-stream
          docker compose -f docker-compose.yml -f docker-compose.aws.yml ps