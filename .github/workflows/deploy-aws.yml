name: Desplegar Rappi-Stream AWS

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rappi-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, rappi-production]
    timeout-minutes: 20

    steps:
      - name: Verificar rama y cambios
        run: |
          set -e
          cd /home/ubuntu/rappi-stream
          test "$(git branch --show-current)" = "dev"
          test -z "$(git status --porcelain)"
          git fetch origin dev

      - name: Actualizar codigo
        run: |
          set -e
          cd /home/ubuntu/rappi-stream
          git merge --ff-only origin/dev

      - name: Construir frontend
        run: |
          set -e
          cd /home/ubuntu/rappi-stream
          docker compose -f docker-compose.yml \
            -f docker-compose.aws.yml \
            -p rappi-stream-actual \
            build frontend

      - name: Publicar frontend
        run: |
          set -e
          cd /home/ubuntu/rappi-stream
          docker compose -f docker-compose.yml \
            -f docker-compose.aws.yml \
            -p rappi-stream-actual \
            up -d --no-deps frontend

      - name: Verificar frontend
        run: |
          set -e
          cd /home/ubuntu/rappi-stream
          docker compose -f docker-compose.yml \
            -f docker-compose.aws.yml \
            -p rappi-stream-actual \
            ps frontend