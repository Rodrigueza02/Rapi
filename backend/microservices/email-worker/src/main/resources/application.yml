spring:
  application:
    name: email-worker

  main:
    web-application-type: none

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rappistream}
    username: ${DB_USER:rappi}
    password: ${DB_PASSWORD:rappi}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        acknowledge-mode: manual

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER:change-me@gmail.com}
    password: ${GMAIL_APP_PASSWORD:change-me}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  email:
    exchange: email_jobs
    queue: email_queue
    routing-key: email.send
    dlq: email_queue.dlq
    stuck-sending-minutes: 5
    recovery-interval-ms: 120000

logging:
  level:
    root: INFO
    emailworker: DEBUG
