
server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rappistream}
    username: ${DB_USER:rappi}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

logging:
  level:
    org.springframework.security: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
    issuer: rappi-stream-auth
