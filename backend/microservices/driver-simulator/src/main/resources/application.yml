spring:
  application:
    name: driver-simulator

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: driver-simulator-group      
      auto-offset-reset: latest             
    producer:
      acks: all
      properties:
        enable.idempotence: true

app:
  simulation:
    on-the-way-seconds: 4
    arrive-seconds: 4
    deliver-seconds: 4