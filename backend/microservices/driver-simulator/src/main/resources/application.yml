spring:
  application:
    name: driver-simulator

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: driver-simulator-group      
      auto-offset-reset: latest             
    producer:
      acks: all
      properties:
        enable.idempotence: true

app:
  simulation:
    on-the-way-seconds: 6   # ASSIGNED → ON_THE_WAY   (visible ~6 s en el dashboard)
    arrive-seconds:     6   # ON_THE_WAY → ARRIVING   (visible ~6 s en el dashboard)
    deliver-seconds:    6   # ARRIVING → DELIVERED    (visible ~6 s en el dashboard)