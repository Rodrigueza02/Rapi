# ============================================================
# docker-compose.aws.yml — Override de producción AWS
# Usar junto con docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml ...
#
# Variables de entorno requeridas en el servidor EC2 (nunca en git):
#   RAPPI_JWT_SECRET, RAPPI_DB_PASSWORD, RAPPI_RABBIT_PASSWORD
# ============================================================

services:

  # ── Frontend con Nginx + TLS (Let's Encrypt) ─────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.aws
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth-service
      - order-api
      - dashboard-backend
    networks:
      - public
    restart: unless-stopped
    mem_limit: 256m

  # ── auth-service ─────────────────────────────────────────
  auth-service:
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rappistream
      DB_USER: rappi
      DB_PASSWORD: ${RAPPI_DB_PASSWORD}
      JWT_SECRET: ${RAPPI_JWT_SECRET}
    restart: unless-stopped

  # ── order-api ────────────────────────────────────────────
  order-api:
    environment:
      JWT_SECRET: ${RAPPI_JWT_SECRET}
      RABBITMQ_PASSWORD: ${RAPPI_RABBIT_PASSWORD}
    restart: unless-stopped

  # ── order-processor ──────────────────────────────────────
  order-processor:
    environment:
      POSTGRES_PASSWORD: ${RAPPI_DB_PASSWORD}
      RABBITMQ_PASSWORD: ${RAPPI_RABBIT_PASSWORD}
    restart: unless-stopped

  # ── dashboard-aggregator ─────────────────────────────────
  dashboard-aggregator:
    environment:
      DB_PASSWORD: ${RAPPI_DB_PASSWORD}
      JWT_SECRET: ${RAPPI_JWT_SECRET}
      RABBITMQ_PASSWORD: ${RAPPI_RABBIT_PASSWORD}
    restart: unless-stopped

  # ── dashboard-backend ────────────────────────────────────
  dashboard-backend:
    restart: unless-stopped

  # ── notification-router ──────────────────────────────────
  notification-router:
    environment:
      RABBITMQ_PASSWORD: ${RAPPI_RABBIT_PASSWORD}
    restart: unless-stopped

  # ── sms-worker ───────────────────────────────────────────
  sms-worker:
    environment:
      RABBITMQ_PASSWORD: ${RAPPI_RABBIT_PASSWORD}
    restart: unless-stopped

  # ── push-worker ──────────────────────────────────────────
  push-worker:
    environment:
      RABBITMQ_PASSWORD: ${RAPPI_RABBIT_PASSWORD}
    restart: unless-stopped

  # ── driver-simulator (solo para demo — no activar en prod silencioso) ──
  # Dejar comentado si no se requiere simulación en la presentación.
  # driver-simulator:
  #   restart: unless-stopped
