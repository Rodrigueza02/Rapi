services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.aws
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth-service
      - order-api
      - dashboard-backend
    networks:
      - public
    restart: unless-stopped
    mem_limit: 256m
