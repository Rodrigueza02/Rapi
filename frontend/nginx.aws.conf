server {
    listen 80;
    server_name rappi-stream.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl;

    ssl_certificate /etc/letsencrypt/live/rappi-stream.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rappi-stream.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;


    # Validacion de certificados Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Sirve archivos estáticos; si no existe devuelve index.html (SPA routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy WebSocket hacia dashboard-backend.
    # El cliente conecta a wss://rappi-stream.duckdns.org/ws
    # Nginx hace el upgrade y reenvía al contenedor interno en :8086/ws.
    location /ws {
        proxy_pass          http://dashboard-backend:8086;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "Upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Proxy hacia los microservicios en producción.
    # En desarrollo esto lo hace el proxy de Vite — aquí es solo para Docker Compose.
    location /api/auth/ {
        proxy_pass         http://auth-service:8087;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /api/order/ {
        proxy_pass         http://order-api:8081;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Estadisticas del dashboard
    location = /api/dashboard/stats {
        proxy_pass http://dashboard-aggregator:8085;
        proxy_set_header Host $host;
    }

    # Pedidos del dashboard
    location /api/dashboard/orders {
        proxy_pass http://dashboard-aggregator:8085;
        proxy_set_header Host $host;
    }

    # Estado Round Robin
    location = /api/dashboard/round-robin {
        proxy_pass http://dashboard-aggregator:8085;
        proxy_set_header Host $host;
    }

    # Mantener las demas rutas del dashboard en su backend original
    location /api/dashboard/ {
        proxy_pass         http://dashboard-backend:8086;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Cache para assets con hash en el nombre (Vite los genera así).
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
