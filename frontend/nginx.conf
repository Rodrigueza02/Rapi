server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Sirve archivos estáticos; si no existe devuelve index.html (SPA routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia los microservicios en producción.
    # En desarrollo esto lo hace el proxy de Vite — aquí es solo para Docker Compose.
    location /api/auth/ {
        proxy_pass         http://auth-service:8087;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /api/order/ {
        proxy_pass         http://order-api:8081;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /api/dashboard/ {
        proxy_pass         http://dashboard-backend:8086;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Cache para assets con hash en el nombre (Vite los genera así).
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
